{% extends "base.html" %}

{% block title %}登录 - WaytoAGI{% endblock %}

{% block content %}
<div class="container">
    <div style="max-width: 400px; margin: 4rem auto; text-align: center;">
        <h2 style="margin-bottom: 2rem;">欢迎登录</h2>
        <p style="margin-bottom: 2rem; color: #666;">请使用邮箱验证码登录</p>

        <div style="text-align: left;">
            <div style="margin-bottom: 1rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">邮箱地址</label>
                <input type="email" id="email" placeholder="请输入邮箱"
                    style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 0.5rem; font-size: 1rem; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 1rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">验证码</label>
                <div style="display: flex; gap: 0.5rem;">
                    <input type="text" id="code" placeholder="请输入6位验证码" maxlength="6"
                        style="flex: 1; padding: 0.75rem; border: 1px solid #ddd; border-radius: 0.5rem; font-size: 1rem; box-sizing: border-box;">
                    <button id="sendBtn" onclick="sendCode()"
                        style="padding: 0.75rem 1rem; background: #07c160; color: white; border: none; border-radius: 0.5rem; cursor: pointer; font-size: 1rem; white-space: nowrap;">
                        获取验证码
                    </button>
                </div>
            </div>

            <button onclick="login()"
                style="width: 100%; padding: 0.75rem; background: #667eea; color: white; border: none; border-radius: 0.5rem; cursor: pointer; font-size: 1rem; margin-top: 1rem;">
                登录 / 注册
            </button>
        </div>

        <p id="message" style="margin-top: 1rem; color: #e64340; font-size: 0.875rem; min-height: 1.25rem;"></p>
    </div>
</div>

<script>
let countdownTimer = null;

function showMessage(msg, isError = true) {
    const el = document.getElementById('message');
    el.textContent = msg;
    el.style.color = isError ? '#e64340' : '#07c160';
}

function startCountdown(seconds) {
    const btn = document.getElementById('sendBtn');
    btn.disabled = true;
    btn.style.background = '#999';
    let remaining = seconds;
    btn.textContent = `${remaining}s 后重试`;

    countdownTimer = setInterval(() => {
        remaining--;
        if (remaining <= 0) {
            clearInterval(countdownTimer);
            btn.disabled = false;
            btn.style.background = '#07c160';
            btn.textContent = '获取验证码';
        } else {
            btn.textContent = `${remaining}s 后重试`;
        }
    }, 1000);
}

function sendCode() {
    const email = document.getElementById('email').value.trim();
    if (!email) {
        showMessage('请输入邮箱地址');
        return;
    }

    fetch('/api/v1/auth/email/code', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email })
    })
    .then(res => res.json())
    .then(data => {
        if (data.code === 200) {
            showMessage('验证码已发送，请查收邮件', false);
            startCountdown(60);
        } else {
            showMessage(data.message || '发送失败');
        }
    })
    .catch(err => {
        showMessage('网络错误，请稍后重试');
        console.error(err);
    });
}

function login() {
    const email = document.getElementById('email').value.trim();
    const code = document.getElementById('code').value.trim();

    if (!email || !code) {
        showMessage('请输入邮箱和验证码');
        return;
    }

    fetch('/api/v1/auth/email/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, code: code })
    })
    .then(res => res.json())
    .then(data => {
        if (data.code === 200 && data.data) {
            // 存储 Token
            localStorage.setItem('access_token', data.data.access_token);
            localStorage.setItem('refresh_token', data.data.refresh_token);
            showMessage('登录成功', false);
            // 跳转首页
            setTimeout(() => {
                window.location.href = '/';
            }, 500);
        } else {
            showMessage(data.message || '登录失败');
        }
    })
    .catch(err => {
        showMessage('网络错误，请稍后重试');
        console.error(err);
    });
}

// 回车键触发登录
document.getElementById('code').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') login();
});
</script>
{% endblock %}
