{% extends "base.html" %}

{% block title %}运营后台 - WaytoAGI{% endblock %}

{% block content %}
<div class="container">
    <h1 style="margin: 2rem 0;">运营后台</h1>

    <div id="statsSection" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1.5rem; margin-bottom: 2rem;">
        <div style="background: white; border-radius: 0.75rem; padding: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.08); text-align: center;">
            <div style="font-size: 2rem; font-weight: bold; color: #667eea;" id="statUsers">-</div>
            <div style="color: #666; margin-top: 0.5rem;">总用户数</div>
        </div>
        <div style="background: white; border-radius: 0.75rem; padding: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.08); text-align: center;">
            <div style="font-size: 2rem; font-weight: bold; color: #07c160;" id="statActivities">-</div>
            <div style="color: #666; margin-top: 0.5rem;">总活动数</div>
        </div>
        <div style="background: white; border-radius: 0.75rem; padding: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.08); text-align: center;">
            <div style="font-size: 2rem; font-weight: bold; color: #faad14;" id="statRegistrations">-</div>
            <div style="color: #666; margin-top: 0.5rem;">总报名数</div>
        </div>
        <div style="background: white; border-radius: 0.75rem; padding: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.08); text-align: center;">
            <div style="font-size: 2rem; font-weight: bold; color: #1890ff;" id="statCheckins">-</div>
            <div style="color: #666; margin-top: 0.5rem;">总签到数</div>
        </div>
        <div style="background: white; border-radius: 0.75rem; padding: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.08); text-align: center;">
            <div style="font-size: 2rem; font-weight: bold; color: #eb2f96;" id="statRate">-</div>
            <div style="color: #666; margin-top: 0.5rem;">签到率</div>
        </div>
    </div>

    <div style="background: white; border-radius: 0.75rem; box-shadow: 0 2px 8px rgba(0,0,0,0.08); padding: 1.5rem;">
        <h2 style="margin-bottom: 1rem;">待审核活动</h2>
        <div id="pendingList">
            <p style="color: #999; text-align: center; padding: 2rem;">加载中...</p>
        </div>
    </div>
</div>

<script>
function getToken() {
    return localStorage.getItem('access_token');
}

async function loadStats() {
    const token = getToken();
    if (!token) {
        document.getElementById('statsSection').innerHTML = '<p style="grid-column: 1 / -1; text-align: center; color: #999;">请先 <a href="/login" style="color: #667eea;">登录</a></p>';
        return;
    }

    try {
        const res = await fetch('/api/v1/admin/stats', {
            headers: { 'Authorization': 'Bearer ' + token }
        });
        const data = await res.json();

        if (data.code === 200 && data.data) {
            const s = data.data;
            document.getElementById('statUsers').textContent = s.total_users;
            document.getElementById('statActivities').textContent = s.total_activities;
            document.getElementById('statRegistrations').textContent = s.total_registrations;
            document.getElementById('statCheckins').textContent = s.total_checkins;
            document.getElementById('statRate').textContent = s.checkin_rate + '%';
        }
    } catch (err) {
        console.error('加载统计失败', err);
    }
}

async function loadPending() {
    const token = getToken();
    if (!token) return;

    try {
        const res = await fetch('/api/v1/admin/activities/pending', {
            headers: { 'Authorization': 'Bearer ' + token }
        });
        const data = await res.json();

        const el = document.getElementById('pendingList');
        if (data.code !== 200) {
            el.innerHTML = `<p style="color: #e64340; text-align: center;">${data.message || '加载失败'}</p>`;
            return;
        }

        const items = data.data && data.data.items ? data.data.items : [];
        if (items.length === 0) {
            el.innerHTML = '<p style="color: #999; text-align: center; padding: 2rem;">暂无待审核活动</p>';
            return;
        }

        el.innerHTML = `<table style="width: 100%; border-collapse: collapse;">
            <thead>
                <tr style="border-bottom: 2px solid #f0f0f0;">
                    <th style="text-align: left; padding: 0.75rem;">活动名称</th>
                    <th style="text-align: left; padding: 0.75rem;">地点</th>
                    <th style="text-align: left; padding: 0.75rem;">时间</th>
                    <th style="text-align: center; padding: 0.75rem;">操作</th>
                </tr>
            </thead>
            <tbody>
                ${items.map(a => `
                    <tr style="border-bottom: 1px solid #f0f0f0;">
                        <td style="padding: 0.75rem;">${a.title}</td>
                        <td style="padding: 0.75rem;">${a.location || '线上'}</td>
                        <td style="padding: 0.75rem;">${formatDate(a.start_time)}</td>
                        <td style="padding: 0.75rem; text-align: center;">
                            <button onclick="auditActivity(${a.id}, 'approve')" style="padding: 0.25rem 0.75rem; background: #07c160; color: white; border: none; border-radius: 0.25rem; cursor: pointer; margin-right: 0.5rem;">通过</button>
                            <button onclick="auditActivity(${a.id}, 'reject')" style="padding: 0.25rem 0.75rem; background: #e64340; color: white; border: none; border-radius: 0.25rem; cursor: pointer;">拒绝</button>
                        </td>
                    </tr>
                `).join('')}
            </tbody>
        </table>`;
    } catch (err) {
        document.getElementById('pendingList').innerHTML = '<p style="color: #e64340; text-align: center;">加载失败</p>';
    }
}

function formatDate(iso) {
    if (!iso) return '待定';
    const d = new Date(iso);
    return `${d.getMonth()+1}月${d.getDate()}日`;
}

async function auditActivity(activityId, action) {
    const token = getToken();
    try {
        const res = await fetch(`/api/v1/admin/activities/${activityId}/audit`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify({ action })
        });
        const data = await res.json();
        if (data.code === 200) {
            alert(action === 'approve' ? '已通过' : '已拒绝');
            loadPending();
            loadStats();
        } else {
            alert(data.message || '操作失败');
        }
    } catch (err) {
        alert('网络错误');
    }
}

loadStats();
loadPending();
</script>
{% endblock %}
