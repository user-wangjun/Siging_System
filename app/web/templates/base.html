<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}WaytoAGI 活动报名平台{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.6; color: #333; }
        .navbar { background: #1a1a2e; color: white; padding: 1rem 0; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .navbar .container { display: flex; justify-content: space-between; align-items: center; }
        .brand { font-size: 1.5rem; font-weight: bold; color: white; text-decoration: none; }
        .nav-links a { color: white; text-decoration: none; margin-left: 2rem; }
        .nav-links a:hover { opacity: 0.8; }
        main { min-height: calc(100vh - 120px); padding: 2rem 0; }
        footer { background: #f8f9fa; text-align: center; padding: 1rem 0; }
        .hero { text-align: center; padding: 4rem 0; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .hero h1 { font-size: 3rem; margin-bottom: 1rem; }
        .hero p { font-size: 1.2rem; margin-bottom: 2rem; }
        .btn { display: inline-block; padding: 0.75rem 2rem; border-radius: 0.5rem; text-decoration: none; font-weight: 500; }
        .btn-primary { background: white; color: #667eea; }
        .features { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem; padding: 4rem 0; }
        .feature { text-align: center; padding: 2rem; }
        .feature h3 { margin-bottom: 1rem; color: #1a1a2e; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="/" class="brand">WaytoAGI</a>
            <div class="nav-links">
                <a href="/activities">活动</a>
                <a href="/orgs">组织</a>
                <a href="/login">登录</a>
            </div>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>&copy; 2024 WaytoAGI. All rights reserved.</p>
    </footer>

    {% block extra_js %}{% endblock %}
</body>
</html>
